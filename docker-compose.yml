services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: labs_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem "ports": o banco fica acessivel apenas pela rede interna do Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - labs-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labs_backend
    volumes:
      - ./backend:/app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LABS_DOCS_PUBLIC: ${LABS_DOCS_PUBLIC:-false}
      # Origens exatas do navegador (protocolo + host + porta). Precisa bater com a URL do frontend.
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Repassa os cabeçalhos do Nginx/Proxy para o Spring reconhecer HTTPS
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - labs-net

  frontend:
    volumes:
      - ./frontend:/app
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL publica da API usada pelo navegador; fica embutida no bundle na hora do build.
        VITE_LABS_API_URL: ${VITE_LABS_API_URL:-}
    container_name: labs_frontend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - labs-net

volumes:
  postgres_data:

networks:
  labs-net:
    driver: bridge