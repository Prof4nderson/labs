<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Lista de Desejos — Wishlist</title>
    <meta name="description" content="Uma lista de desejos com fotos, títulos e descrições de tudo o que eu quero conquistar." />
    <meta property="og:title" content="Minha Lista de Desejos — Wishlist" />
    <meta property="og:description" content="Uma lista de desejos com fotos, títulos e descrições de tudo o que eu quero conquistar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="neon-scope" id="scope">
      <div class="aurora" aria-hidden="true"></div>

      <header class="container header">
        <div class="glass navbar">
          <span class="neon-text brand" id="owner-name"></span>
          <span class="count">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
            <span id="item-count"></span>
          </span>
        </div>
      </header>

      <main class="container main">
        <!-- Envolto em uma div para alinhar o título e o botão lado a lado -->
        <div class="title-wrapper">
          <h1 class="neon-title" id="site-title"></h1>
          <a href="lista.zip" download class="btn-download glass">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>Download do projeto</span>
          </a>
        </div>

        <p class="subtitle" id="site-subtitle"></p>
        <div class="grid" id="grid"></div>
      </main>

      <footer class="container footer">
        <div class="glass footer-box" id="footer-text"></div>
      </footer>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
