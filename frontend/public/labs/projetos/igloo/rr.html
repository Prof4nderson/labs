<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-RAID // GOTHIC FLUORESCENT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-magenta: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-purple: #9d00ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffea00;
            --glass-bg: rgba(10, 6, 18, 0.55);
            --glass-border: rgba(0, 243, 255, 0.25);
            --glass-glow: rgba(157, 0, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #030108;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 30%, #1a0033 0%, #030108 80%),
                linear-gradient(rgba(255,0,85,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,243,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .game-wrapper {
            position: relative;
            display: flex;
            gap: 20px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 40px var(--glass-glow);
        }

        /* Glassmorphism Sidebar HUD */
        .hud-panel {
            width: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background: rgba(18, 10, 32, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .hud-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 
                0 0 8px var(--neon-magenta),
                0 0 20px var(--neon-magenta);
            margin-bottom: 5px;
        }

        .hud-subtitle {
            font-size: 0.65rem;
            text-align: center;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .stat-group {
            margin-bottom: 18px;
        }

        .stat-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        .gauge-container {
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 6px;
            overflow: hidden;
            padding: 2px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }

        .gauge-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--neon-magenta), var(--neon-green));
            border-radius: 4px;
            box-shadow: 0 0 12px var(--neon-green);
            transition: width 0.1s linear, background 0.3s;
        }

        .controls-hint {
            font-size: 0.65rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            border-left: 2px solid var(--neon-purple);
        }

        .controls-hint span {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 85, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.9),
                inset 0 0 15px rgba(0, 243, 255, 0.15);
        }

        canvas {
            display: block;
            background: #05020a;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(5, 2, 12, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 30px;
            text-align: center;
        }

        .overlay-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-magenta), 0 0 30px var(--neon-purple);
            margin-bottom: 10px;
        }

        .overlay-desc {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .btn-glow {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: #fff;
            padding: 14px 32px;
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.4), rgba(157, 0, 255, 0.4));
            border: 1px solid var(--neon-cyan);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transition: all 0.2s ease;
        }

        .btn-glow:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 25px var(--neon-cyan), 0 0 10px var(--neon-magenta);
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.7), rgba(157, 0, 255, 0.7));
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="hud-panel">
            <div>
                <div class="hud-title">RIVER RAID</div>
                <div class="hud-subtitle">GOTHIC // REBUILD</div>

                <div class="stat-group">
                    <div class="stat-label">PONTUAÇÃO</div>
                    <div id="scoreDisplay" class="stat-value">000000</div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">NÍVEL / RIFT</div>
                    <div id="levelDisplay" class="stat-value" style="color: var(--neon-purple);">01</div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">
                        <span>CYBER ENERGIA</span>
                        <span id="fuelNum">100%</span>
                    </div>
                    <div class="gauge-container">
                        <div id="fuelBar" class="gauge-fill"></div>
                    </div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">ESCUDO MAGNÉTICO</div>
                    <div id="shieldDisplay" class="stat-value" style="color: var(--neon-yellow);">DESATIVADO</div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">NAVES RESTANTES</div>
                    <div id="livesDisplay" class="stat-value" style="color: var(--neon-magenta);">3</div>
                </div>
            </div>

            <div class="controls-hint">
                <span>[←][→]</span> NAVEGAR<br>
                <span>[↑][↓]</span> VELOCIDADE<br>
                <span>[ESPAÇO]</span> CANHÃO DE PLASMA
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="480" height="640"></canvas>

            <div id="startOverlay" class="overlay-screen">
                <div class="overlay-title">ABYSS RIFT</div>
                <div class="overlay-desc">NAVEGADOR GÓTICO FLUORESCENTE</div>
                <button id="startBtn" class="btn-glow">INICIAR MISSÃO</button>
            </div>

            <div id="gameOverOverlay" class="overlay-screen hidden">
                <div class="overlay-title" style="color: var(--neon-magenta);">SISTEMA DESTRUÍDO</div>
                <div class="overlay-desc" id="finalScoreText">PONTUAÇÃO FINAL: 0</div>
                <button id="restartBtn" class="btn-glow">REINICIALIZAR</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        class SoundSystem {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }

            playShoot() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playExplosion() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const bufSize = this.ctx.sampleRate * 0.3;
                const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.3);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playFuel() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playShield() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const audio = new SoundSystem();

        let gameRunning = false;
        let score = 0;
        let level = 1;
        let lives = 3;
        let fuel = 100;
        let shieldTime = 0;
        let speed = 3.5;
        let distanceY = 0;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 110,
            width: 28,
            height: 38,
            vx: 0
        };

        let bullets = [];
        let enemies = [];
        let fuelCells = [];
        let shieldItems = [];
        let mines = [];
        let bridges = [];
        let particles = [];
        let bankSpires = [];

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // Correção do scroll: distanceY - y faz o terreno mover para baixo (nave para a frente)
        function getRiverLimits(y) {
            const absoluteY = distanceY - y;
            const wave1 = Math.sin(absoluteY * 0.005) * 80;
            const wave2 = Math.sin(absoluteY * 0.012) * 40;
            const center = (canvas.width / 2) + wave1 + wave2;

            const currentWidth = Math.max(130, 260 - (level * 8));
            
            return {
                left: center - currentWidth / 2,
                right: center + currentWidth / 2
            };
        }

        let nextBridgeDistance = 1800;
        let lastSpawnY = 0;

        function spawnEntities() {
            if (distanceY - lastSpawnY > 110) {
                lastSpawnY = distanceY;
                const limits = getRiverLimits(-40);
                const spawnX = limits.left + 30 + Math.random() * (limits.right - limits.left - 60);

                const rand = Math.random();
                if (rand < 0.22) {
                    fuelCells.push({ x: spawnX, y: -40, width: 22, height: 32 });
                } else if (rand < 0.30) {
                    shieldItems.push({ x: spawnX, y: -40, size: 16 });
                } else if (rand < 0.45) {
                    mines.push({ x: spawnX, y: -40, radius: 11, pulse: 0 });
                } else if (rand < 0.82) {
                    const type = Math.random() > 0.5 ? 'drone' : 'gargoyle';
                    enemies.push({
                        x: spawnX,
                        y: -40,
                        width: type === 'drone' ? 26 : 34,
                        height: 26,
                        type: type,
                        vx: type === 'gargoyle' ? (Math.random() - 0.5) * 3 : 0
                    });
                }

                // Gerar espirais góticas decorativas nas margens da terra
                if (Math.random() < 0.6) {
                    bankSpires.push({
                        side: 'left',
                        x: limits.left - 15 - Math.random() * 30,
                        y: -50,
                        height: 25 + Math.random() * 20
                    });
                }
                if (Math.random() < 0.6) {
                    bankSpires.push({
                        side: 'right',
                        x: limits.right + 15 + Math.random() * 30,
                        y: -50,
                        height: 25 + Math.random() * 20
                    });
                }
            }

            if (distanceY > nextBridgeDistance) {
                nextBridgeDistance += 2200 + (level * 200);
                bridges.push({ y: -50, height: 32, destroyed: false });
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 22; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: (Math.random() - 0.5) * 9,
                    life: 1.0,
                    color: color || '#ff0055'
                });
            }
        }

        let lastShot = 0;
        function shoot() {
            const now = Date.now();
            if (now - lastShot > 160) {
                bullets.push({ x: player.x, y: player.y - 15, width: 5, height: 16 });
                audio.playShoot();
                lastShot = now;
            }
        }

        function resetPlayer() {
            const limits = getRiverLimits(player.y);
            player.x = (limits.left + limits.right) / 2;
            player.vx = 0;
            fuel = 100;
            shieldTime = 0;
        }

        function update() {
            if (!gameRunning) return;

            if (keys['ArrowUp'] || keys['KeyW']) speed = 5.8;
            else if (keys['ArrowDown'] || keys['KeyS']) speed = 1.8;
            else speed = 3.6;

            distanceY += speed;

            if (shieldTime > 0) shieldTime -= 1;

            fuel -= 0.05 * (speed / 3.6);
            if (fuel <= 0) {
                handleDeath();
                return;
            }

            if (keys['ArrowLeft'] || keys['KeyA']) player.vx -= 0.65;
            if (keys['ArrowRight'] || keys['KeyD']) player.vx += 0.65;

            player.vx *= 0.82;
            player.x += player.vx;

            if (keys['Space']) shoot();

            // Colisão com Margens do Rio
            const currentLimits = getRiverLimits(player.y);
            if (player.x - player.width / 2 < currentLimits.left || player.x + player.width / 2 > currentLimits.right) {
                if (shieldTime <= 0) {
                    createExplosion(player.x, player.y, '#00f3ff');
                    audio.playExplosion();
                    handleDeath();
                    return;
                } else {
                    player.x = Math.max(currentLimits.left + 15, Math.min(currentLimits.right - 15, player.x));
                }
            }

            spawnEntities();

            // Balas
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= 13;
                if (b.y < -20) { bullets.splice(i, 1); continue; }

                for (let br of bridges) {
                    if (!br.destroyed && Math.abs(b.y - br.y) < 20) {
                        br.destroyed = true;
                        score += 500;
                        level++;
                        createExplosion(b.x, br.y, '#9d00ff');
                        audio.playExplosion();
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            // Inimigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += speed;
                e.x += e.vx;

                const eLimits = getRiverLimits(e.y);
                if (e.x < eLimits.left + 15 || e.x > eLimits.right - 15) e.vx *= -1;

                if (Math.abs(player.x - e.x) < (player.width + e.width) / 2 &&
                    Math.abs(player.y - e.y) < (player.height + e.height) / 2) {
                    createExplosion(e.x, e.y, '#ff0055');
                    audio.playExplosion();
                    enemies.splice(i, 1);
                    if (shieldTime <= 0) {
                        handleDeath();
                        return;
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.abs(b.x - e.x) < e.width / 2 + 5 && Math.abs(b.y - e.y) < e.height / 2 + 5) {
                        createExplosion(e.x, e.y, '#ff0055');
                        audio.playExplosion();
                        score += e.type === 'drone' ? 100 : 150;
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }

                if (e.y > canvas.height + 50) enemies.splice(i, 1);
            }

            // Minas Flutuantes
            for (let i = mines.length - 1; i >= 0; i--) {
                let m = mines[i];
                m.y += speed;
                m.pulse += 0.08;

                if (Math.hypot(player.x - m.x, player.y - m.y) < m.radius + 12) {
                    createExplosion(m.x, m.y, '#ffea00');
                    audio.playExplosion();
                    mines.splice(i, 1);
                    if (shieldTime <= 0) {
                        handleDeath();
                        return;
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.hypot(b.x - m.x, b.y - m.y) < m.radius + 6) {
                        createExplosion(m.x, m.y, '#ffea00');
                        audio.playExplosion();
                        score += 60;
                        mines.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }

                if (m.y > canvas.height + 50) mines.splice(i, 1);
            }

            // Combustível
            for (let i = fuelCells.length - 1; i >= 0; i--) {
                let f = fuelCells[i];
                f.y += speed;

                if (Math.abs(player.x - f.x) < (player.width + f.width) / 2 &&
                    Math.abs(player.y - f.y) < (player.height + f.height) / 2) {
                    fuel = Math.min(100, fuel + 0.9);
                    audio.playFuel();
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.abs(b.x - f.x) < f.width / 2 + 5 && Math.abs(b.y - f.y) < f.height / 2 + 5) {
                        createExplosion(f.x, f.y, '#00ff66');
                        audio.playExplosion();
                        score += 80;
                        fuelCells.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }

                if (f.y > canvas.height + 50) fuelCells.splice(i, 1);
            }

            // Escudos
            for (let i = shieldItems.length - 1; i >= 0; i--) {
                let s = shieldItems[i];
                s.y += speed;

                if (Math.hypot(player.x - s.x, player.y - s.y) < s.size + 10) {
                    shieldTime = 300; // ~5 segundos
                    audio.playShield();
                    shieldItems.splice(i, 1);
                }

                if (s.y > canvas.height + 50) shieldItems.splice(i, 1);
            }

            // Pontes
            for (let i = bridges.length - 1; i >= 0; i--) {
                let br = bridges[i];
                br.y += speed;

                if (!br.destroyed && Math.abs(player.y - br.y) < player.height / 2 + 10) {
                    if (shieldTime <= 0) {
                        createExplosion(player.x, player.y, '#ff0055');
                        audio.playExplosion();
                        handleDeath();
                        return;
                    }
                }

                if (br.y > canvas.height + 100) bridges.splice(i, 1);
            }

            // Espirais das margens (Cenário)
            for (let i = bankSpires.length - 1; i >= 0; i--) {
                let sp = bankSpires[i];
                sp.y += speed;
                if (sp.y > canvas.height + 100) bankSpires.splice(i, 1);
            }

            // Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }

            score += Math.floor(speed * 0.2);
            updateHUD();
        }

        function handleDeath() {
            lives--;
            updateHUD();
            if (lives <= 0) {
                gameRunning = false;
                document.getElementById('finalScoreText').innerText = `PONTUAÇÃO FINAL: ${score.toString().padStart(6, '0')}`;
                document.getElementById('gameOverOverlay').classList.remove('hidden');
            } else {
                resetPlayer();
            }
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = score.toString().padStart(6, '0');
            document.getElementById('levelDisplay').innerText = level.toString().padStart(2, '0');
            document.getElementById('livesDisplay').innerText = lives;
            
            const fuelBar = document.getElementById('fuelBar');
            const fuelNum = document.getElementById('fuelNum');
            const fuelPct = Math.max(0, Math.floor(fuel));
            fuelBar.style.width = fuelPct + '%';
            fuelNum.innerText = fuelPct + '%';

            const shieldDisp = document.getElementById('shieldDisplay');
            if (shieldTime > 0) {
                shieldDisp.innerText = `${Math.ceil(shieldTime / 60)}s`;
                shieldDisp.style.color = 'var(--neon-yellow)';
            } else {
                shieldDisp.innerText = 'DESATIVADO';
                shieldDisp.style.color = 'rgba(255,255,255,0.3)';
            }

            if (fuelPct < 25) {
                fuelBar.style.background = 'var(--neon-magenta)';
                fuelBar.style.boxShadow = '0 0 12px var(--neon-magenta)';
            } else {
                fuelBar.style.background = 'linear-gradient(90deg, var(--neon-magenta), var(--neon-green))';
                fuelBar.style.boxShadow = '0 0 12px var(--neon-green)';
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Margens e Terreno Gótico
            ctx.save();
            ctx.fillStyle = '#070210';
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';

            // Margem Esquerda
            ctx.beginPath();
            ctx.moveTo(0, 0);
            for (let y = 0; y <= canvas.height; y += 10) {
                const limits = getRiverLimits(y);
                ctx.lineTo(limits.left, y);
            }
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Margem Direita
            ctx.strokeStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff';
            ctx.beginPath();
            ctx.moveTo(canvas.width, 0);
            for (let y = 0; y <= canvas.height; y += 10) {
                const limits = getRiverLimits(y);
                ctx.lineTo(limits.right, y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // 2. Grade Neon do Rio
            ctx.save();
            ctx.strokeStyle = 'rgba(157, 0, 255, 0.18)';
            ctx.lineWidth = 1;
            const gridOffset = distanceY % 40;
            for (let y = gridOffset; y < canvas.height; y += 40) {
                const limits = getRiverLimits(y);
                ctx.beginPath();
                ctx.moveTo(limits.left, y);
                ctx.lineTo(limits.right, y);
                ctx.stroke();
            }
            ctx.restore();

            // 3. Espirais Decorativas nas Margens (Gothic Spires)
            for (let sp of bankSpires) {
                ctx.save();
                ctx.strokeStyle = sp.side === 'left' ? '#ff0055' : '#00f3ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.beginPath();
                ctx.moveTo(sp.x, sp.y);
                ctx.lineTo(sp.x - 8, sp.y + sp.height);
                ctx.lineTo(sp.x + 8, sp.y + sp.height);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // 4. Pontes
            for (let br of bridges) {
                ctx.save();
                if (!br.destroyed) {
                    ctx.fillStyle = '#120024';
                    ctx.strokeStyle = '#9d00ff';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#9d00ff';
                    ctx.lineWidth = 4;
                    ctx.fillRect(0, br.y - br.height / 2, canvas.width, br.height);
                    ctx.strokeRect(0, br.y - br.height / 2, canvas.width, br.height);

                    ctx.fillStyle = '#00f3ff';
                    ctx.shadowColor = '#00f3ff';
                    ctx.fillRect(canvas.width / 2 - 40, br.y - 6, 80, 12);
                } else {
                    ctx.strokeStyle = 'rgba(255, 0, 85, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, br.y - 5, canvas.width * 0.3, 10);
                    ctx.strokeRect(canvas.width * 0.7, br.y - 5, canvas.width * 0.3, 10);
                }
                ctx.restore();
            }

            // 5. Minas Flutuantes
            for (let m of mines) {
                ctx.save();
                ctx.strokeStyle = '#ffea00';
                ctx.fillStyle = 'rgba(255, 234, 0, 0.3)';
                ctx.shadowBlur = 12 + Math.sin(m.pulse) * 6;
                ctx.shadowColor = '#ffea00';
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(m.x - 15, m.y); ctx.lineTo(m.x + 15, m.y);
                ctx.moveTo(m.x, m.y - 15); ctx.lineTo(m.x, m.y + 15);
                ctx.stroke();
                ctx.restore();
            }

            // 6. Itens de Escudo (Cristais Azuis)
            for (let s of shieldItems) {
                ctx.save();
                ctx.strokeStyle = '#ffea00';
                ctx.fillStyle = 'rgba(255, 234, 0, 0.4)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffea00';
                ctx.beginPath();
                ctx.moveTo(s.x, s.y - s.size);
                ctx.lineTo(s.x + s.size, s.y);
                ctx.lineTo(s.x, s.y + s.size);
                ctx.lineTo(s.x - s.size, s.y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            // 7. Cânisteres de Combustível
            for (let f of fuelCells) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 255, 102, 0.2)';
                ctx.strokeStyle = '#00ff66';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ff66';
                ctx.lineWidth = 2;
                ctx.fillRect(f.x - f.width / 2, f.y - f.height / 2, f.width, f.height);
                ctx.strokeRect(f.x - f.width / 2, f.y - f.height / 2, f.width, f.height);

                ctx.fillStyle = '#00ff66';
                ctx.font = '10px Orbitron';
                ctx.fillText('FUEL', f.x - 14, f.y + 4);
                ctx.restore();
            }

            // 8. Inimigos
            for (let e of enemies) {
                ctx.save();
                ctx.shadowBlur = 12;
                if (e.type === 'drone') {
                    ctx.strokeStyle = '#ff0055';
                    ctx.shadowColor = '#ff0055';
                    ctx.fillStyle = 'rgba(255, 0, 85, 0.3)';
                    ctx.beginPath();
                    ctx.moveTo(e.x, e.y - 13);
                    ctx.lineTo(e.x + 13, e.y + 13);
                    ctx.lineTo(e.x - 13, e.y + 13);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = '#9d00ff';
                    ctx.shadowColor = '#9d00ff';
                    ctx.fillStyle = 'rgba(157, 0, 255, 0.4)';
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.restore();
            }

            // 9. Balas
            ctx.save();
            ctx.fillStyle = '#00f3ff';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00f3ff';
            for (let b of bullets) {
                ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
            }
            ctx.restore();

            // 10. Nave do Jogador
            if (gameRunning) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.vx * 0.05);

                if (shieldTime > 0) {
                    ctx.strokeStyle = '#ffea00';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffea00';
                    ctx.beginPath();
                    ctx.arc(0, 0, 28, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.shadowBlur = 18;
                ctx.shadowColor = '#00f3ff';
                ctx.strokeStyle = '#00f3ff';
                ctx.fillStyle = 'rgba(10, 5, 20, 0.8)';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(0, -20);
                ctx.lineTo(14, 15);
                ctx.lineTo(5, 10);
                ctx.lineTo(0, 18);
                ctx.lineTo(-5, 10);
                ctx.lineTo(-14, 15);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ff0055';
                ctx.shadowColor = '#ff0055';
                ctx.beginPath();
                ctx.arc(0, -2, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // 11. Partículas
            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.restore();
            }

            requestAnimationFrame(() => {
                update();
                render();
            });
        }

        function initGame() {
            score = 0;
            level = 1;
            lives = 3;
            fuel = 100;
            shieldTime = 0;
            distanceY = 0;
            enemies = [];
            bullets = [];
            fuelCells = [];
            shieldItems = [];
            mines = [];
            bridges = [];
            particles = [];
            bankSpires = [];
            resetPlayer();
            updateHUD();
            gameRunning = true;
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startOverlay').classList.add('hidden');
            initGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOverOverlay').classList.add('hidden');
            initGame();
        });

        render();
    </script>
</body>
</html>
